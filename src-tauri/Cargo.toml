[package]
name = "sichermail"
version = "0.0.0"
description = "SicherMail – sicherer Open-Source-Mailclient für den Desktop"
authors = ["SicherMail-Mitwirkende"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"

[lib]
# Eigener Name, damit es unter Windows keinen Namenskonflikt mit dem Programm gibt.
name = "sichermail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
