[package]
name = "sichermail"
version = "0.3.0"
description = "SicherMail – sicherer Open-Source-Mailclient für den Desktop"
authors = ["SicherMail-Mitwirkende"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.90"

[lib]
# Eigener Name, damit es unter Windows keinen Namenskonflikt mit dem Programm gibt.
name = "sichermail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
roxmltree = "0.21"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1"] }
zeroize = { version = "1", features = ["serde"] }
mail-parser = "0.11"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ammonia = "4"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
ring = "0.17"
hex = "0.4"
pgp = { version = "0.21", default-features = false }
rand = { version = "0.8", default-features = false, features = ["std", "getrandom"] }
smallvec = "1"
# S/MIME (#56): dieselbe OpenSSL, die für SQLCipher ohnehin mitkompiliert wird (vendored, keine
# Systembibliothek); dazu die Wurzelzertifikate des Betriebssystems.
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = "0.9"
foreign-types = "0.3"
rustls-native-certs = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Die Schlüsselableitung von OpenPGP (S2K) ist ohne Optimierung sehr langsam; das macht Tests
# und Entwicklungsbuilds zäh. Nur diese Rechen-Crates werden auch im Dev-Profil optimiert.
[profile.dev.package.pgp]
opt-level = 3

[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha1-checked]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }
rcgen = "0.14"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

# Integrationstests liegen im gemeinsamen Ordner tests/ des Repos.
[[test]]
name = "konto"
path = "../tests/integration/konto.rs"

[[test]]
name = "starttls"
path = "../tests/integration/starttls.rs"

[[test]]
name = "empfang"
path = "../tests/integration/empfang.rs"

[[test]]
name = "anzeige"
path = "../tests/integration/anzeige.rs"

[[test]]
name = "speicher"
path = "../tests/integration/speicher.rs"

[[test]]
name = "senden"
path = "../tests/integration/senden.rs"

[[test]]
name = "extern_proxy"
path = "../tests/integration/extern_proxy.rs"

[[test]]
name = "pgp"
path = "../tests/integration/pgp.rs"

[[test]]
name = "smime"
path = "../tests/integration/smime.rs"
