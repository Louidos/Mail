name: Release

# Erstellt beim Push eines Versions-Tags (vX.Y.Z) ein GitHub-Release
# mit dem passenden Abschnitt aus CHANGELOG.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: CHANGELOG-Abschnitt auslesen
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { drin = 1; next }
            drin && /^## / { exit }
            drin { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Kein CHANGELOG-Abschnitt für $version gefunden" >&2
            exit 1
          fi

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
