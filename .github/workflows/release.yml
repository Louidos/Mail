name: Release

# Erstellt ein GitHub-Release mit dem passenden Abschnitt aus CHANGELOG.md und den
# Installationspaketen für Windows, macOS und Linux (#48):
# - automatisch beim Push eines Versions-Tags (vX.Y.Z),
# - oder von Hand („Run workflow“) mit Version und Commit; dann legt der Workflow
#   den Tag selbst an (für Umgebungen, in denen Tags nicht gepusht werden können).
#
# Alles läuft in diesem einen Workflow-Lauf: Ein vom Workflow mit GITHUB_TOKEN gepushter Tag
# löst keine weiteren Workflows aus. Erst wenn alle Pakete gebaut sind, wird der Tag (falls
# nötig) angelegt und das Release mit Paketen, SHA256SUMS.txt und Herkunftsnachweis erstellt.
# Scheitert ein Paket, entsteht kein Release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v, z. B. 0.1.0"
        required: true
      commit:
        description: "Commit auf main, auf den der Tag zeigen soll (Standard: aktueller Stand von main)"
        required: false

permissions:
  contents: read

jobs:
  vorbereiten:
    name: Version und Commit prüfen
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ziel.outputs.version }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Version und Commit bestimmen
        id: ziel
        env:
          EINGABE_VERSION: ${{ inputs.version }}
          EINGABE_COMMIT: ${{ inputs.commit }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$EINGABE_VERSION"
            commit="${EINGABE_COMMIT:-$GITHUB_SHA}"
          else
            version="${GITHUB_REF_NAME#v}"
            commit="$GITHUB_SHA"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Ungültige Version: $version" >&2
            exit 1
          fi
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "Ungültiger Commit: $commit" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.ziel.outputs.commit }}
          fetch-depth: 0

      - name: Vollständige Commit-Kennung festhalten
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prüfen, dass der Commit auf main liegt und die Version stimmt
        env:
          VERSION: ${{ steps.ziel.outputs.version }}
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "Commit liegt nicht auf main" >&2; exit 1; }
          paket="$(node -p "require('./package.json').version")"
          if [ "$paket" != "$VERSION" ]; then
            echo "package.json hat Version $paket, nicht $VERSION" >&2
            exit 1
          fi
          grep -q "^version = \"$VERSION\"$" src-tauri/Cargo.toml || { echo "Cargo.toml passt nicht" >&2; exit 1; }
          grep -q "\"version\": \"$VERSION\"" src-tauri/tauri.conf.json || { echo "tauri.conf.json passt nicht" >&2; exit 1; }

      - name: CHANGELOG-Abschnitt auslesen
        env:
          VERSION: ${{ steps.ziel.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { drin = 1; next }
            drin && /^## / { exit }
            drin { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Kein CHANGELOG-Abschnitt für $VERSION gefunden" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  pakete:
    name: Installationspakete
    needs: vorbereiten
    uses: ./.github/workflows/pakete.yml
    with:
      commit: ${{ needs.vorbereiten.outputs.commit }}
    secrets: inherit

  release:
    name: Release erstellen
    needs: [vorbereiten, pakete]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.vorbereiten.outputs.commit }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pakete-*
          path: pakete
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Pakete prüfen und Prüfsummen erzeugen
        run: |
          cd pakete
          for muster in '*.deb' '*.rpm' '*.AppImage' '*.msi' '*-setup.exe' '*.dmg'; do
            # shellcheck disable=SC2086 # Muster soll aufgelöst werden
            ls $muster >/dev/null 2>&1 || { echo "Paket $muster fehlt" >&2; exit 1; }
          done
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Herkunft der Pakete bestätigen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pakete/*

      - name: Hinweise zu Signatur und Prüfung anhängen
        env:
          APPLE_SIGNIERT: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
          WINDOWS_SIGNIERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        run: |
          {
            echo
            echo "### Installationspakete"
            echo
            echo "- Windows: \`.msi\` oder \`-setup.exe\`"
            echo "- macOS (Apple Silicon und Intel): \`.dmg\`"
            echo "- Linux: \`.deb\`, \`.rpm\` oder \`.AppImage\`"
            echo
            echo "Prüfsummen stehen in \`SHA256SUMS.txt\`. Die Herkunft jedes Pakets lässt sich prüfen mit"
            echo "\`gh attestation verify <paket> --repo $GITHUB_REPOSITORY\`."
            echo
            if [ "$APPLE_SIGNIERT" = "true" ]; then
              echo "- macOS: signiert."
            else
              echo "- **macOS: nicht signiert.** Gatekeeper warnt beim ersten Öffnen; siehe Abschnitt Installation im README."
            fi
            if [ "$WINDOWS_SIGNIERT" = "true" ]; then
              echo "- Windows: signiert."
            else
              echo "- **Windows: nicht signiert.** SmartScreen warnt beim ersten Start; siehe Abschnitt Installation im README."
            fi
            echo "- Linux: Pakete sind nicht signiert; Prüfsumme und Herkunftsnachweis ersetzen die Signatur."
          } >> release-notes.md

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: |
          tag="v$VERSION"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Bestehende Tags werden nie verschoben.
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag gibt es schon" >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "$VERSION"
            git push origin "$tag"
          fi
          # Erst als Entwurf mit allen Dateien, dann veröffentlichen: kein halbes Release.
          gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag --draft pakete/*
          gh release edit "$tag" --draft=false
