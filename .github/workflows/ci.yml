name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Wöchentlich prüfen, ob für vorhandene Abhängigkeiten neue Sicherheitslücken bekannt sind.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  sicherheit:
    name: Sicherheitsprüfung der Abhängigkeiten
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: npm audit (bricht bei Lücken ab Stufe „high“ ab)
        run: npm audit --audit-level=high

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (bricht bei bekannten Lücken ab)
        working-directory: src-tauri
        run: cargo audit

  pruefen:
    name: Tests und Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Systembibliotheken für Tauri installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm ci
        run: npm ci

      - name: npm run lint
        run: npm run lint

      - name: npm test
        run: npm test

      - name: Frontend bauen (wird von Tauri eingebunden)
        run: npm run build

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy -- -D warnings
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test-Mailserver starten (GreenMail)
        run: scripts/test-mailserver.sh start

      - name: cargo test (inklusive Integrationstests gegen den Test-Mailserver)
        working-directory: src-tauri
        run: cargo test -- --include-ignored

      - name: Test-Mailserver stoppen
        if: always()
        run: scripts/test-mailserver.sh stop
